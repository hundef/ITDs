<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="tidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Rounded Gradient Background Card -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#tidGrad)" />
  <rect x="7" y="7" width="86" height="86" rx="22" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" />

  <!-- High-Tech Interlocking Neural Diamond Symbol -->
  <g transform="translate(50, 50)">
    <!-- Central Shield / Layers Icon -->
    <path d="M-22 -14 L0 -26 L22 -14 L0 -2 L-22 -14 Z" fill="url(#glowGrad)" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M-22 -2 L0 10 L22 -2 L0 22 L-22 -2 Z" fill="rgba(255,255,255,0.2)" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M-22 10 L0 22 L22 10 L0 34 L-22 10 Z" fill="rgba(6, 182, 212, 0.4)" stroke="#22d3ee" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Central Glowing Core Node -->
    <circle cx="0" cy="-2" r="4" fill="#ffffff" />
  </g>
</svg>
