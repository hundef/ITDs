<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1599d6"/>
      <stop offset="100%" stop-color="#102d62"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#20b8d8"/>
      <stop offset="100%" stop-color="#1b4f9a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="#ffffff"/>

  <!-- ITD -->
  <g transform="translate(250,220)">
    <!-- I -->
    <rect x="20" y="85" width="52" height="190" rx="3" fill="url(#blue)"/>
    <rect x="20" y="35" width="52" height="40" rx="4" fill="url(#blue)"/>

    <!-- T -->
    <path d="M90 35H310V80H235V275H165V80H90Z" fill="url(#blue)"/>
    <g fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M190 105V150L210 170V215L195 230V258"/>
      <path d="M210 110V145"/>
      <path d="M180 140V175L195 190"/>
      <circle cx="210" cy="103" r="6" fill="#ffffff"/>
      <circle cx="180" cy="133" r="6" fill="#ffffff"/>
    </g>

    <!-- D -->
    <path d="M320 35H430C540 35 595 85 595 155C595 225 540 275 430 275H320Z" fill="url(#blue)"/>
    <path d="M385 85H430C485 85 515 112 515 155C515 198 485 225 430 225H385Z" fill="#ffffff"/>

    <!-- Globe -->
    <circle cx="450" cy="155" r="48" fill="#eaf5fb" stroke="#173f78" stroke-width="4"/>
    <ellipse cx="450" cy="155" rx="20" ry="48" fill="none" stroke="#2a6fa9" stroke-width="2"/>
    <path d="M402 145H498M402 165H498M410 125H490M410 185H490" stroke="#2a6fa9" stroke-width="2" opacity=".8"/>
    <path d="M426 124l17 9 12-3 15 14-5 15-13 4-7 15-19-7-5-18 12-12z" fill="#1d5a9c" opacity=".9"/>
    <path d="M461 178l18-8 9 8-7 14-15 5z" fill="#1d5a9c" opacity=".9"/>

    <!-- pixels -->
    <g fill="url(#blue)">
      <rect x="565" y="-30" width="14" height="14"/>
      <rect x="540" y="-10" width="14" height="14"/>
      <rect x="590" y="-5" width="14" height="14"/>
      <rect x="565" y="15" width="22" height="22"/>
      <rect x="535" y="30" width="14" height="14"/>
      <rect x="555" y="52" width="14" height="14"/>
      <rect x="590" y="40" width="14" height="14"/>
    </g>

    <!-- orbital swoosh -->
    <path d="M-10 240C125 320 400 300 590 160C650 115 690 65 705 15"
          fill="none" stroke="url(#arc)" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- divider -->
  <g transform="translate(0,560)" stroke="#183d73" stroke-width="3">
    <line x1="300" y1="0" x2="550" y2="0"/>
    <circle cx="600" cy="0" r="8" fill="#1d5799" stroke="none"/>
    <line x1="650" y1="0" x2="900" y2="0"/>
  </g>

  <!-- title -->
  <text x="600" y="620" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="31" font-weight="700" letter-spacing="5"
        fill="#183d73">INTELLIGENCE TECHNOLOGY DIVISION</text>
</svg>